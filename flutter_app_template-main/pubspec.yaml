name: flutter_app_template
description: "Production-grade Flutter starter template — MVVM + Clean Architecture + Provider."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.5+1

  # Navigation
  go_router: ^17.4.0

  # Dependency injection
  get_it: ^9.2.1

  # Networking
  dio: ^5.11.0
  connectivity_plus: ^7.3.1

  # Backend
  supabase_flutter: ^2.17.1

  # Storage
  shared_preferences: ^2.5.5
  flutter_secure_storage: ^11.0.0

  # Platform
  permission_handler: ^13.0.0

  # Formatting / i18n
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/
    - assets/icons/
